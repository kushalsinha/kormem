[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kormem-engine"
version = "0.1.0"
description = "Local memory engine for kormem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "langchain-text-splitters>=0.3.0",
  "numpy>=1.26.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "google-genai>=1.0.0",
  "fastembed>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
kormem-engine = "kormem.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kormem"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
