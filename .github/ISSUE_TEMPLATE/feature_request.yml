name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like kormem to do?
      description: Commands, flags or output you have in mind are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: qmd
    attributes:
      label: Compatibility
      options:
        - label: This changes a QMD-compatible command or flag
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would be willing to send a pull request
